  /* 主题：kami-seal —— 朱砂印。唯一的高饱和款：印章朱红强调 + 暖米白纸。
     方向：强调色敢跳（brand 饱和度约 60%，是全家族最冒险的一套），
     但仍守住纸感与可读性（brand 对纸底 5.7:1，stone 5.5:1，全部 ≥ AA）。 */
  :root {
    --parchment: #faf6f0;
    --ivory: #fffdf8;
    --border: #ecdcd2;
    --border-soft: #f4e9e0;
    --near-black: #2b1d18;
    --stone: #7d5c50;
    --olive: #8a4a38;
    --brand: #b0362a;
    --brand-tint: #f9e9e4;
    --dark-warm: #4a2f27;
  }
</style>
